<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  input::placeholder{color:#b7ab9d}
  input:focus{outline:none}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  /* responsive: photo panel hides, form centers on narrow viewports */
  .login-photo{display:block}
  .login-shell{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
  .login-form-pad{padding:56px 64px}
  @media (max-width:820px){
    .login-shell{grid-template-columns:1fr}
    .login-photo{display:none}
    .login-form-pad{padding:40px 28px 48px}
    .login-card{border-radius:0 !important;min-height:100vh}
  }
</style>
</helmet>

<div style="min-height:100vh;width:100%;display:flex;align-items:center;justify-content:center;background:#EFE7E1;font-family:Inter,sans-serif;padding:32px">

  <div class="login-card login-shell" style="width:100%;max-width:980px;min-height:600px;background:#FBF6F4;border-radius:24px;overflow:hidden;border:1px solid rgba(26,23,20,.08)">

    <!-- ===== PANEL FOTO (desktop) ===== -->
    <div class="login-photo" style="position:relative">
      <image-slot id="login-photo" style="position:absolute;inset:0;width:100%;height:100%" shape="rect" fit="cover" src="uploads/salon-belleza-vs-peluqueria.jpg" placeholder="Foto editorial · ambiente del salón"></image-slot>
      <div style="position:absolute;inset:0;background:linear-gradient(160deg,rgba(122,58,79,.12) 0%,rgba(26,23,20,.0) 38%,rgba(26,23,20,.58) 100%)"></div>
      <div style="position:absolute;left:40px;top:36px;font-family:Fraunces,serif;font-size:24px;font-weight:500;color:#FBF6F4;letter-spacing:-.01em;text-shadow:0 1px 8px rgba(20,12,4,.3)">Salón</div>
      <div style="position:absolute;left:40px;right:40px;bottom:40px">
        <div style="font-family:Fraunces,serif;font-weight:400;font-size:30px;line-height:1.12;color:#FBF6F4;letter-spacing:-.01em;text-shadow:0 1px 10px rgba(20,12,4,.28)">Tu estilo,<br>reservado.</div>
        <div style="font-size:13.5px;line-height:1.55;color:rgba(251,246,244,.86);margin-top:12px;max-width:280px">Entra a tu cuenta para gestionar citas, ver tu historial y guardar a tus estilistas favoritas.</div>
      </div>
    </div>

    <!-- ===== PANEL FORM ===== -->
    <div class="login-form-pad" style="display:flex;flex-direction:column;justify-content:center">

      <!-- logo solo en móvil -->
      <div class="login-photo" style="display:none"></div>

      <div style="animation:fade .4s ease both">
        <div style="font-family:Fraunces,serif;font-size:30px;font-weight:500;color:#1A1714;letter-spacing:-.015em">Bienvenida de vuelta</div>
        <div style="font-size:14px;color:#8a7f72;margin-top:7px">Ingresa para continuar con tu reserva.</div>

        <!-- email -->
        <div style="margin-top:30px">
          <label style="display:block;font-size:12px;font-weight:600;letter-spacing:.03em;color:#7a6f63;margin-bottom:8px">Correo</label>
          <div style="display:flex;align-items:center;gap:11px;height:52px;padding:0 16px;border-radius:14px;background:#fff;border:1.5px solid {{ emailBorder }};transition:border-color .2s ease">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a59a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"></rect><path d="m3 7 9 6 9-6"></path></svg>
            <input value="{{ email }}" onInput="{{ onEmail }}" onFocus="{{ focusEmail }}" onBlur="{{ blurAll }}" type="email" placeholder="hola@correo.com" style="flex:1;border:none;background:transparent;font-family:Inter,sans-serif;font-size:15px;color:#1A1714" />
          </div>
        </div>

        <!-- password -->
        <div style="margin-top:18px">
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px">
            <label style="font-size:12px;font-weight:600;letter-spacing:.03em;color:#7a6f63">Contraseña</label>
            <span style="font-size:12px;font-weight:500;color:#B0455F;cursor:pointer">¿Olvidaste?</span>
          </div>
          <div style="display:flex;align-items:center;gap:11px;height:52px;padding:0 16px;border-radius:14px;background:#fff;border:1.5px solid {{ passBorder }};transition:border-color .2s ease">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#a59a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path></svg>
            <input value="{{ pass }}" onInput="{{ onPass }}" onFocus="{{ focusPass }}" onBlur="{{ blurAll }}" type="{{ passType }}" placeholder="••••••••" style="flex:1;border:none;background:transparent;font-family:Inter,sans-serif;font-size:15px;color:#1A1714;letter-spacing:.05em" />
            <div onClick="{{ togglePass }}" style="cursor:pointer;display:flex;padding:4px">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a59a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:{{ eyeOpen }}"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7-10-7-10-7z"></path><circle cx="12" cy="12" r="3"></circle></svg>
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a59a8d" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="display:{{ eyeOff }}"><path d="M9.9 4.24A9.1 9.1 0 0 1 12 4c6 0 10 7 10 7a17 17 0 0 1-2.6 3.3M6.6 6.6A17 17 0 0 0 2 11s4 7 10 7a9 9 0 0 0 3.4-.66M1 1l22 22"></path></svg>
            </div>
          </div>
        </div>

        <!-- remember -->
        <div onClick="{{ toggleRemember }}" style="display:flex;align-items:center;gap:9px;margin-top:18px;cursor:pointer">
          <div style="width:20px;height:20px;border-radius:6px;display:flex;align-items:center;justify-content:center;background:{{ rememberBg }};border:1.5px solid {{ rememberBorder }};transition:all .2s ease">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FBF6F4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" style="opacity:{{ rememberCheck }}"><path d="M20 6 9 17l-5-5"></path></svg>
          </div>
          <span style="font-size:13px;color:#6b6258">Mantener sesión iniciada</span>
        </div>

        <!-- submit -->
        <div onClick="{{ submit }}" style="display:flex;align-items:center;justify-content:center;gap:10px;height:54px;margin-top:26px;border-radius:14px;background:{{ btnBg }};color:#FBF6F4;opacity:{{ btnOpacity }};cursor:{{ btnCursor }};transition:all .2s ease">
          <sc-if value="{{ loading }}" hint-placeholder-val="{{ false }}">
            <div style="width:18px;height:18px;border-radius:50%;border:2px solid rgba(251,246,244,.4);border-top-color:#FBF6F4;animation:spin .7s linear infinite"></div>
          </sc-if>
          <sc-if value="{{ notLoading }}" hint-placeholder-val="{{ true }}">
            <span style="font-family:Fraunces,serif;font-size:17px;font-weight:500;letter-spacing:.01em">Ingresar</span>
          </sc-if>
        </div>

        <!-- divider -->
        <div style="display:flex;align-items:center;gap:14px;margin:24px 0">
          <div style="flex:1;height:1px;background:rgba(26,23,20,.1)"></div>
          <span style="font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#a59a8d">o continúa con</span>
          <div style="flex:1;height:1px;background:rgba(26,23,20,.1)"></div>
        </div>

        <!-- social -->
        <div style="display:flex;gap:12px">
          <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:50px;border-radius:14px;background:#fff;border:1.5px solid rgba(26,23,20,.12);cursor:pointer;font-size:14px;font-weight:500;color:#1A1714">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 10.2v3.9h5.5c-.24 1.45-1.7 4.25-5.5 4.25-3.3 0-6-2.74-6-6.1s2.7-6.1 6-6.1c1.88 0 3.14.8 3.86 1.49l2.63-2.54C16.96 3.4 14.7 2.4 12 2.4 6.95 2.4 2.85 6.5 2.85 11.55S6.95 20.7 12 20.7c5.27 0 8.76-3.7 8.76-8.92 0-.6-.06-1.06-.15-1.52H12z"></path></svg>
            Google
          </div>
          <div style="flex:1;display:flex;align-items:center;justify-content:center;gap:9px;height:50px;border-radius:14px;background:#fff;border:1.5px solid rgba(26,23,20,.12);cursor:pointer;font-size:14px;font-weight:500;color:#1A1714">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="#1A1714"><path d="M16.4 12.6c0-2.2 1.8-3.2 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.14-2.7.8-3.3.8-.7 0-1.7-.78-2.8-.76-1.5.02-2.8.85-3.5 2.16-1.5 2.6-.4 6.5 1.1 8.6.7 1 1.5 2.2 2.6 2.16 1-.04 1.4-.67 2.7-.67 1.2 0 1.6.67 2.7.65 1.1-.02 1.8-1.06 2.5-2.07.8-1.2 1.1-2.32 1.1-2.38-.02-.01-2.1-.81-2.1-3.2zM14.3 6.2c.6-.72 1-1.7.9-2.7-.86.03-1.9.57-2.5 1.29-.55.63-1.03 1.65-.9 2.62.95.07 1.92-.49 2.5-1.21z"></path></svg>
            Apple
          </div>
        </div>

        <!-- signup -->
        <div style="text-align:center;margin-top:26px;font-size:13.5px;color:#8a7f72">
          ¿Primera vez en Salón? <span style="font-weight:600;color:#B0455F;cursor:pointer">Crea tu cuenta</span>
        </div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1040,&quot;height&quot;:700}}">
class Component extends DCLogic {
  state = { email: '', pass: '', showPass: false, remember: true, focus: null, loading: false };

  renderVals() {
    const s = this.state;
    const valid = /\S+@\S+\.\S+/.test(s.email) && s.pass.length >= 4;
    const PINK = '#B0455F';
    return {
      email: s.email, pass: s.pass,
      onEmail: (e) => this.setState({ email: e.target.value }),
      onPass: (e) => this.setState({ pass: e.target.value }),
      focusEmail: () => this.setState({ focus: 'email' }),
      focusPass: () => this.setState({ focus: 'pass' }),
      blurAll: () => this.setState({ focus: null }),
      emailBorder: s.focus === 'email' ? PINK : 'rgba(26,23,20,.12)',
      passBorder: s.focus === 'pass' ? PINK : 'rgba(26,23,20,.12)',

      passType: s.showPass ? 'text' : 'password',
      eyeOpen: s.showPass ? 'flex' : 'none',
      eyeOff: s.showPass ? 'none' : 'flex',
      togglePass: () => this.setState({ showPass: !s.showPass }),

      remember: s.remember,
      rememberBg: s.remember ? PINK : '#fff',
      rememberBorder: s.remember ? PINK : 'rgba(26,23,20,.22)',
      rememberCheck: s.remember ? 1 : 0,
      toggleRemember: () => this.setState({ remember: !s.remember }),

      btnBg: valid ? PINK : '#cdbfb4',
      btnOpacity: valid ? 1 : 0.7,
      btnCursor: valid ? 'pointer' : 'not-allowed',
      loading: s.loading,
      notLoading: !s.loading,
      submit: () => {
        if (!valid || s.loading) return;
        this.setState({ loading: true });
        setTimeout(() => this.setState({ loading: false }), 1600);
      },
    };
  }
}
</script>
</body>
</html>
